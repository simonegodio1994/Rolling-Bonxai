rolling_bonxai_server_node:
  ros__parameters:
    frame_id: "map"
    base_frame_id: "body"
    topic_in: "/ffs_points2"

    occupancy:
      resolution: 0.1

      # Non lasciare infinito verticale, soprattutto con stereo
      occupancy_min_z: -2.0
      occupancy_max_z: 10.0

      # Più alto = serve più evidenza per considerare occupato
      occupancy_threshold: 0.65

    sensor_model:
      # 10 m per stereo denso è molto permissivo
      max_range: 10.0

      # Hit più debole: un singolo punto non deve "bloccare" subito
      hit: 0.55

      # Miss più forte: lo spazio libero deve pulire meglio
      miss: 0.40

      # Limiti più stretti per evitare saturazione troppo rapida
      min: 0.25
      max: 0.75

    rolling:
      coordinate_system:
        chunk_size: 4.0

      transition_manager:
        hysteresis_ratio: 0.3

      loading_policy:
        name: "neighborhood"
        neighborhood:
          radius: 8

      storage:
        full_save_folder_path: "/home/tmp/bonxai_chunks"

      asyncio:
        enable_io: true
        num_load_threads: 3
        num_save_threads: 1

    server:
      cleanup_interval_sec: 60.0

    stats:
      enable_stats: true
      quick_stats: true
      publish_occupied_voxels: true
      publish_rate: 2.0